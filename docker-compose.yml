# T01.1 / T15.1 — Ambiente de desenvolvimento do UniPlace
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uniplace
      POSTGRES_USER: uniplace
      POSTGRES_PASSWORD: uniplace
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniplace -d uniplace"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Os bind mounts podem ter permissões 700/600 e UIDs corporativos.
    # Root somente neste Compose local; a imagem usa um usuário sem privilégios.
    user: "0:0"
    environment:
      DEBUG: "True"
      SSO_ADAPTER: mock
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: uniplace
      POSTGRES_USER: uniplace
      POSTGRES_PASSWORD: uniplace
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/docs/', timeout=3)"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10

  frontend:
    build: ./frontend
    user: "0:0"
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
  backend_media:
  frontend_node_modules:
